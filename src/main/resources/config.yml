polis-baseline:
  # Only default-only users become Polis; staff and permanent ranks remain unchanged.
  enabled: true
  default-group: default
  # Every account receives the implicit LuckPerms default group. Keep this
  # aligned with purchases.yml so purchases do not create a redundant parent.
  base-group: default
  reconcile-interval-seconds: 60

# Seguridad de FastMachines: el addon no valida por sí mismo la región de la máquina.
fast-machines-protection:
  enabled: true
  bypass-permission: odysseia.fastmachines.bypass
  denied-message: "&cNo puedes usar las Fast Machines de otra protección."

# La compra SFMaster entrega la guía Cheat original y la vuelve inutilizable al expirar el pase.
sfmaster-guide:
  enabled: true
  block-cheat-command: true
  cleanup-interval-seconds: 30

# ─────────────────────────────────────────────────────────────────────────────
# Puente de Traducción Bidireccional Discord ↔ Minecraft (via Star LibreTranslate)
# ─────────────────────────────────────────────────────────────────────────────
discord-translator:
  enabled: true
  # URL base de la API de traducción en Star (sin trailing slash)
  api-url: "https://translate.drakescraft.cl"
  # API key de LibreTranslate configurada en Star
  api-key: "REPLACE_ME"
  # Traducir mensajes de Discord al español en Minecraft
  translate-discord-to-mc: true
  # Traducir mensajes de Minecraft al inglés en Discord
  translate-mc-to-discord: false
  # Idioma al que se traducen los mensajes recibidos en Minecraft
  mc-target-language: "es"
  # Idioma al que se traducen los mensajes de MC para Discord
  discord-target-language: "en"

# Defensa de economía: las ventas rápidas no pueden financiar granjas AFK.
economy-guard:
  sell-inventory:
    cooldown-seconds: 20
    window-seconds: 3600
    max-items-per-material: 3456
    # Se añaden a la lista segura del código para impedir una reactivación accidental.
    blocked-materials:
      - COBBLESTONE
      - STONE
      - DEEPSLATE
      - COBBLED_DEEPSLATE
      - DIRT
      - SAND
      - GRAVEL
      - GRANITE
      - DIORITE
      - ANDESITE
      - NETHERRACK
      - BASALT
      - BLACKSTONE

# Máximo de cuentas simultáneas por dirección real. Añadir aquí redes compartidas
# autorizadas antes de elevar este límite; no guardar nombres ni credenciales.
anti-alt:
  enabled: true
  max-concurrent-per-ip: 2
  exempt-addresses: []

# Capa transversal contra macros de comercio. Complementa las cuotas por ítem
# de /sellinv y cubre comandos equivalentes de otros plugins.
exploit-guard:
  enabled: true
  commerce:
    enabled: true
    bypass-permission: odysseia.exploitguard.bypass
    cooldown-millis: 750
    burst-window-seconds: 20
    max-commands-per-window: 8
    restriction-seconds: 120
    commands:
      - sell
      - sellall
      - sellinv
      - sellhand
      - vender
      - venderinv
      - ushop
      - ah
      - auctionhouse

# Modalidades del servidor.
# Los rangos, los kits y la economia se comparten entre todas; lo que se separa es el
# inventario (via InvSwitcher) y el almacenamiento personal (via las bovedas de aqui abajo).
modalidades:
  modos:
    # La base es Survival: cualquier mundo no declarado en otra modalidad cae aqui, asi que
    # los mundos de galactifun, las arenas de jefes, el hub y el limbo siguen igual que siempre.
    survival:
      nombre: "&aSurvival"
      descripcion: "Slimefun, magia, jefes y progresion clasica."
      icono: GRASS_BLOCK
      comando: survival
      mundos: []
    skyblock:
      nombre: "&bSkyBlock"
      descripcion: "Tu isla en el vacio. Crece segun tu rango."
      icono: SNOW_BLOCK
      comando: skyblock
      mundos:
        - bskyblock_world
    oneblock:
      nombre: "&dOneBlock"
      descripcion: "Un solo bloque infinito, por fases."
      icono: END_STONE
      comando: oneblock
      mundos:
        - oneblock_world
  # Comando que /survival despacha desde consola para llevar al jugador a la modalidad base.
  comando-spawn: spawn
  # Bovedas personales, una coleccion independiente por modalidad.
  bovedas:
    filas: 6
    cantidad-base: 3
  guard:
    enabled: true
    # Dentro de una isla estos comandos abren la boveda de esa modalidad en vez de la global.
    comandos-boveda:
      - pv
      - vault
      - playervault
    # Comandos que quedan bloqueados dentro de las islas por dar acceso a almacenamiento
    # global del survival. Admiten subcomando ("team echest"): se bloquea cualquier comando
    # que empiece con el patron, asi que el resto de /team sigue funcionando.
    # /ec no va aqui: InvSwitcher ya separa el cofre de ender, y las mochilas de Slimefun
    # viajan en el inventario, que tambien esta separado.
    comandos-bloqueados:
      # CrazyAuctions: guardar un shulker en el survival y retirarlo en la isla era el puente
      # mas usado. Se listan las cuatro etiquetas del plugin.yml, no solo /ah.
      - crazyauctions
      - crazyauction
      - ah
      - ca
      # BetterTeams: el cofre de ender del equipo es una base global, no la del jugador.
      - team echest
      - teamadmin echest
      - teama echest
      # DrakesSlimeMarket: compra material Slimefun con dinero, que hoy es comun a las tres
      # modalidades, asi que sirve de puente indirecto de items.
      - sfmercado
      # Las piedras de ProtectionStones solo se pueden colocar en los mundos del Survival, por
      # el world_list_type de cada .toml. Un jugador compro una dentro de su isla de OneBlock y
      # descubrio que no la podia poner: se le cobro sin poder usarla ahi.
      - tiendaprot
      - ps get
    # Mensaje por bloqueo, con el patron como clave y guiones en vez de espacios. Sin entrada,
    # se usa el generico de almacenamiento.
    mensajes:
      ps-get: "&6DrakesCraft &8· &7Las protecciones solo se colocan en el &eSurvival&7. Aqui protege tu isla &eBentoBox&7, y tu terreno crece con tu rango."
      tiendaprot: "&6DrakesCraft &8· &7La tienda de protecciones es del &eSurvival&7. Vuelve con &e/survival&7 para comprar y colocar tu piedra."

# Neutraliza items corruptos antes de que tumben la conexion. Nacio de un crash de paquete
# provocado por una cabeza con perfil corrupto al abrir un contenedor: el item queda en el
# mundo, asi que cualquiera que lo abra repite el crash.
corrupt-item-guard:
  enabled: true
