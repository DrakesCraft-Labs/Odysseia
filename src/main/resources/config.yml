chat-filter:
  enabled: true
  # Cuando la sancion se anuncia, el resto del chat entiende por que alguien dejo de hablar.
  # La palabra no se repite en el anuncio: solo el staff la ve.
  anuncio-global: true
  # Warns acumulados que disparan cada sancion.
  warns:
    mute: 3
    kick: 5
    ban: 7
  duracion:
    mute: 10m
    ban: 1d
  # Se comparan como palabra completa y tras deshacer el leet: "m1erd4" cuenta, "diputado" no.
  words:
    - "ctm"
    - "conchetumare"
    - "conchatumare"
    - "culiao"
    - "hijo de puta"
    - "hdp"
    - "pelotudo"
    - "puta madre"
    - "mierda"
    - "maricon"
    - "negro de mierda"
    - "mogolico"

# Traducción automática por locale; reemplaza drakes_translation.dsc.
translation:
  enabled: true
  # nLogin suele completar la autenticación entre 5 y 15 segundos.
  join-delay-ticks: 400

# Guardia de automatizaciones vanilla. No inspecciona clics ni bloquea autoclicker.
automation-guard:
  enabled: true
  redstone:
    enabled: true
    # Los límites se aplican sólo si existe una estructura vanilla de reloj.
    fast-window-seconds: 10
    fast-pulse-limit: 40
    long-window-seconds: 120
    long-pulse-limit: 180
    minimum-components: 3
    minimum-timing-components: 2
    # Los dos primeros excesos sólo pausan el circuito; la tercera reincidencia
    # dentro de diez minutos desarma un componente temporizador.
    violations-before-break: 3
    violation-window-seconds: 600
    suppression-seconds: 5
  afk:
    enabled: true
    inactivity-seconds: 300
    minimum-displacement: 4.0
    notification-cooldown-seconds: 30

