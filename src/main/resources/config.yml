# ╔══════════════════════════════════════════════╗
# ║             Odysseia — config.yml            ║
# ╚══════════════════════════════════════════════╝

# Habilitar envio de eventos a Discord
discord:
  enabled: true
  # Canal de actualizaciones: solo estado operativo y eventos relevantes del servidor.
  webhook-url: "REPLACE_ME"
  # Canal de moderación: baneos, expulsiones reales y accesos bloqueados.
  # Nunca hace fallback al canal de actualizaciones.
  webhook-moderation-url: "REPLACE_ME"

# Integraciones opcionales. Odysseia sigue funcionando aunque el plugin externo no exista.
integrations:
  diosesdrakes:
    boss-rewards:
      enabled: true

# Telemetría operativa hacia Star. No interviene en compras ni almacena datos de jugadores.
star-monitor:
  enabled: false
  endpoint: "https://web.drakescraft.cl/api/odysseia/events"
  signing-secret: "REPLACE_ME"
  # Archivo privado dentro de plugins/Odysseia; no versionar ni copiar al repositorio.
  signing-secret-file: "star-monitor.secret"
  heartbeat-interval-seconds: 60

# ─────────────────────────────────────────────
# Eventos de terror limitados a mundos explícitos con jugadores presentes.
horror-night:
  enabled: true
  worlds: [world]

# ─────────────────────────────────────────────
# Borde visual de ProtectionStones. Solo usa paquetes de bloque al cliente.
protection-border:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS
  max-blocks: 2048
  staff-permission: odysseia.protection.border

# ─────────────────────────────────────────────
#  Ciclo de Prefijos del Propietario (Owner)
# ─────────────────────────────────────────────
owner-cycle:
  # Habilitar el placeholder de PAPI %odysseia_owner_prefix%
  enabled: true
  # Intervalo para alternar visualmente (minutos)
  interval-minutes: 30
  # Prefijos a alternar para odiseo
  odiseo:
    prefix-a: "&8✠ &6&lᴏᴅɪsᴇᴏ &8✦ &6&o"
    prefix-b: "&8✠ &4&lᴅᴜᴇñᴏ &8✦ &4"
  # Prefijos a alternar para penelope
  penelope:
    prefix-a: "&d✦ &d&lᴘᴇɴᴇʟᴏᴘᴇ &8✦ &d"
    prefix-b: "&d✦ &d&lᴅᴜᴇñᴀ &8✦ &d"

# ─────────────────────────────────────────────
#  Efectos de Armadura de Rangos
# ─────────────────────────────────────────────
# Se aplican si el jugador tiene el set completo y el permiso correspondiente
armor-effects:
  refresh-interval-seconds: 30
  effect-duration-seconds: 180
  
  # Hercules (VIP 1) - requiere drakes.kit.hercules y full diamante
  hercules:
    speed: 1
    resistance: 1
    
  # Hestia (VIP 2) - requiere drakes.kit.hestia y full diamante
  hestia:
    speed: 2
    health-boost: 1
    saturation: true
    
  # Hermes (VIP 3) - requiere drakes.kit.hermes y full diamante
  hermes:
    speed: 4
    health-boost: 1
    saturation: true
    
  # Hefesto (VIP 4) - requiere drakes.kit.hefesto y full netherite
  hefesto:
    speed: 2
    health-boost: 2
    fire-resistance: true
    saturation: true
    
  # Artemisa (VIP 5) - requiere drakes.kit.artemisa y full netherite
  artemisa:
    speed: 3
    health-boost: 2
    strength: 1
    saturation: true
    
  # Afrodita (VIP 6) - requiere drakes.kit.afrodita y full netherite
  afrodita:
    speed: 3
    health-boost: 3
    strength: 1
    regeneration: 1
    saturation: true
    
  # Zeus (VIP 7) - requiere drakes.kit.zeus y full netherite
  zeus:
    speed: 4
    health-boost: 4
    strength: 2
    resistance: 1
    saturation: true

  # Oldschool (Veteranos 5+ años) - requiere drakes.kit.oldschool
  oldschool:
    speed: 3
    health-boost: 2
    fire-resistance: true
    saturation: true
    resistance: 1

# ─────────────────────────────────────────────
#  Reliquias Personalizadas
# ─────────────────────────────────────────────
papa-de-mar:
  # Valores al consumir la Papa de mar
  food-restored: 1
  saturation-restored: 8.4
  # Item entregado por el scheduler y por /papademar.
  item:
    material: BAKED_POTATO
    name: "&6&l✦ Papa de mar ✦"
    lore:
      - "&7Relicario legendario de Drakes."
      - "&7Ha cruzado temporadas, guerras y treguas."
      - "&7A veces se canjeó por llaves ante aldeanos."
      - "&7A veces fue comida, spam y pura leyenda."
      - "&8Dicen que con esta papa terminó una guerra."
      - "&8Y que quien la porta carga historia en las manos."
    # Formato: ENCHANTMENT:LEVEL. Dejar [] para no encantar.
    enchantments:
      - VANISHING_CURSE:1
  # Trueque con el NPC del spawn (/papatrueque)
  trueque:
    # Porcentaje de papas que se pierde al DEPOSITAR en la alcancía.
    # La papa se reparte sola cada 15 min y no se gasta en nada más: sin una fuga, la cantidad en
    # circulación solo puede subir. Nunca se lleva la última: depositar 1 siempre guarda 1.
    merma-porcentaje: 5.0

  delivery:
    enabled: true
    # Tiempo de entrega automática a todos los jugadores (minutos).
    interval-minutes: 15
    message: "&eRecibiste la &6&l✦ Papa de mar ✦&e."
  # Compatibilidad con configs viejas; si existe delivery.interval-minutes se usa primero.
  delivery-interval-minutes: 15

# ─────────────────────────────────────────────
#  Densidad de spawners de Slimefun
# ─────────────────────────────────────────────
# ElectricSpawners ya limita a 6 las entidades vivas de CADA spawner, y por eso uno solo no molesta.
# Lo que no controla es cuantos se pueden pegar unos a otros: apilar seis en una columna multiplica
# ese tope por seis. Con LevelledMobs poniendoles nivel 105, esos mobs tardan muchisimo en morir y
# se acumulan. Se cuenta por distancia, no por chunk: el problema es la densidad.
slimefun-spawners:
  enabled: true
  # Cuantos caben dentro del radio, contando el que se intenta colocar.
  max-por-zona: 2
  radio: 8

# ─────────────────────────────────────────────
#  Limite de coordenadas para jugadores Bedrock
# ─────────────────────────────────────────────
# El cliente de Minecraft Bedrock pierde precision mas alla de ~150.000 bloques: el terreno
# tiembla, el jugador no puede caminar y los bloques dejan de responder. No se arregla desde el
# servidor. BedrockRangeGuardListener aplica un borde de mundo personal a cada cuenta Bedrock
# (Floodgate las nombra con un punto delante) y cancela cualquier teletransporte que la deje
# fuera. Los jugadores de Java no se ven afectados y pueden viajar hasta donde este el Bedrock.
bedrock-guard:
  enabled: true
  limite: 150000
  # El nether comprime coordenadas 8:1, asi que su limite equivale al del overworld.
  limite-nether: 18750
  # Solo mundos de exploracion libre. Las islas y el hub ya son pequenos de por si.
  mundos:
    - world
    - world_nether
    - world_the_end
    - world_galactifun_earth_orbit
    - world_galactifun_the_moon
    - world_galactifun_mars
    - world_galactifun_venus
    - world_galactifun_io
    - world_galactifun_titan
    - world_galactifun_enceladus

# ─────────────────────────────────────────────
#  Kit de Inicio (StarterKit)
# ─────────────────────────────────────────────
starter-kit:
  enabled: true
  # Entrega exclusivamente kits.inicial a cuentas nuevas. Espera a que nLogin
  # termine; si el inventario está lleno, reintenta sin duplicar objetos.
  kit: inicial
  delay-ticks: 400
  max-retries: 3
  retry-delay-ticks: 200
  welcome-message: "&8[&6&lDrakesCraft&8] &eKit de inicio entregado. ¡Bienvenido a la Odisea!"
  # Kit de bienvenida propio de cada modalidad, entregado la primera vez que el jugador entra
  # a ese mundo. Sin esto, quien ya recibio el kit inicial en Survival llegaba a la isla sin
  # nada: la entrega era una sola vez por cuenta, no por modalidad.
  # La clave es el id de la modalidad en "modalidades.modos". Dejar en blanco para no entregar.
  por-modalidad:
    skyblock: inicial-skyblock
    oneblock: inicial-oneblock

# ─────────────────────────────────────────────
#  ChatGames Scheduler
# ─────────────────────────────────────────────
chatgames:
  # Odysseia owns this schedule. Set ChatGames' external automatic-games to false
  # to avoid overlapping events after the next restart.
  enabled: true
  timezone: "America/Santiago"
  minimum-players: 2
  min-interval-minutes: 12
  max-interval-minutes: 18
  timeout-seconds: 35
  # The sequence resets every calendar month: week 1 math, week 2 runes,
  # week 3 trivia, week 4 reflexes and week 5 cartographer codes.
  reward-commands:
    - "minecraft:xp add {player} 150 points"
    - "eco give {player} 500"

# ─────────────────────────────────────────────
#  Leñador Loco
# ─────────────────────────────────────────────
lenador-loco:
  enabled: true
  target-name: "Leñador Loco"
  check-interval-seconds: 5
  effects:
    - type: RESISTANCE
      duration-seconds: 12
      amplifier: 1
    - type: REGENERATION
      duration-seconds: 12
      amplifier: 1
    - type: STRENGTH
      duration-seconds: 12
      amplifier: 0
    - type: SPEED
      duration-seconds: 12
      amplifier: 0

# ─────────────────────────────────────────────
#  Presencia y Eventos (DrakesLabPresence)
# ─────────────────────────────────────────────
presence:
  enabled: true
  # Identificador legible en mensajes (opcional, por defecto el del servidor)
  server-label: ""
  # Los heartbeats no se publican en Actualizaciones: Star Monitor es la fuente operativa.
  heartbeat:
    enabled: false
    interval-minutes: 15
  # Segundos de espera tras reload/arranque antes del primer POST
  startup-delay-seconds: 60
  # Eventos especificos a enviar
  events:
    server-startup: true
    server-shutdown: true
    player-join: false
    player-quit: false
    player-death: false
    advancement: false
    rate-limit-per-minute: 12

# Los reinicios programados pertenecen a Star y Pterodactyl. Odysseia solo
# protege inventarios durante la ventana final iniciada por el supervisor.

# ─────────────────────────────────────────────
#  Alertador Diario de Caducidad de Rangos VIP
# ─────────────────────────────────────────────
vipalerts:
  enabled: true
  # Umbral de días restantes para destacar advertencia [PRÓXIMO A VENCER]
  warning-threshold-days: 3

# ─────────────────────────────────────────────
#  Entrega Automática de Tienda (StoreManager)
# ─────────────────────────────────────────────
store:
  enabled: true
  # URL base de la API de la tienda (Fastify)
  api-url: "https://web.drakescraft.cl/api/store"
  # Clave API secreta (debe coincidir con STORE_API_KEY en el .env)
  api-key: "REPLACE_ME_STORE_API_KEY"
  # Frecuencia de verificación en segundos
  poll-interval-seconds: 60
  # Compatibilidad con el flujo antiguo. Purchase Engine usa purchase-engine.announcements.
  announcement-webhook-url: "REPLACE_ME_LEGACY_WEBHOOK"
  # Mensaje de felicitaciones en el chat in-game (Soporta códigos de color '&')
  chat-announcement: "&6&l⚡ &e¡Felicidades &b{player} &eha adquirido &a{product} &een la tienda! ¡Gracias por apoyar al servidor! &6&l⚡"
  # Mensaje del webhook de Discord
  discord-announcement: "🎉 **¡Felicidades {player} ha comprado {product} en el servidor! ¡Gracias por mantener el servidor vivo!** 🎉"
  # Sonido global emitido en el servidor ante compras
  global-sound:
    enabled: true
    sound: "UI_TOAST_CHALLENGE_COMPLETE"

  # Comandos a ejecutar por cada producto de la tienda
  # {player} se reemplazará por el nick exacto del jugador
  packages:
    hercules:
      require-online: true
      commands:
        - "lp user {player} parent addtemp hercules 30d accumulate"
        - "eco give {player} 25000"
        - "kit hercules {player}"
        - "ps give viphercules {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Hércules!"
    hestia:
      require-online: true
      commands:
        - "lp user {player} parent addtemp hestia 30d accumulate"
        - "eco give {player} 50000"
        - "kit hestia {player}"
        - "ps give viphestia {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Hestia!"
    hermes:
      require-online: true
      commands:
        - "lp user {player} parent addtemp hermes 30d accumulate"
        - "eco give {player} 100000"
        - "kit hermes {player}"
        - "ps give viphermes {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Hermes!"
    hefesto:
      require-online: true
      commands:
        - "lp user {player} parent addtemp hefesto 30d accumulate"
        - "eco give {player} 175000"
        - "kit hefesto {player}"
        - "ps give viphefesto {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Hefesto!"
    artemisa:
      require-online: true
      commands:
        - "lp user {player} parent addtemp artemisa 30d accumulate"
        - "eco give {player} 300000"
        - "kit artemisa {player}"
        - "ps give vipartemisa {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Artemisa!"
    afrodita:
      require-online: true
      commands:
        - "lp user {player} parent addtemp afrodita 30d accumulate"
        - "eco give {player} 500000"
        - "kit afrodita {player}"
        - "ps give vipafrodita {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Afrodita!"
    zeus:
      require-online: true
      commands:
        - "lp user {player} parent addtemp zeus 30d accumulate"
        - "eco give {player} 1000000"
        - "kit zeus {player}"
        - "ps give vipzeus {player} 1"
        - "msg {player} &a¡Gracias por comprar el rango Zeus!"
    # Subrangos (Categoría 2)
    minero:
      require-online: true
      commands:
        - "lp user {player} parent addtemp minero 30d accumulate"
        - "kit minero {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Minero!"
    cazador:
      require-online: true
      commands:
        - "lp user {player} parent addtemp cazador 30d accumulate"
        - "kit cazador {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Cazador!"
    constructor:
      require-online: true
      commands:
        - "lp user {player} parent addtemp constructor 30d accumulate"
        - "kit constructor {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Constructor!"
    lenador:
      require-online: true
      commands:
        - "lp user {player} parent addtemp lenador 30d accumulate"
        - "kit lenador {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Leñador!"
    alquimista:
      require-online: true
      commands:
        - "lp user {player} parent addtemp alquimista 30d accumulate"
        - "kit alquimista {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Alquimista!"
    nomada:
      require-online: true
      commands:
        - "lp user {player} parent addtemp nomada 30d accumulate"
        - "kit nomada {player}"
        - "msg {player} &a¡Gracias por adquirir el rol de Nómada!"
    # Dragmas (Categoría 3 de la tienda web - 3 paquetes definidos)
    dragmas-saco:
      require-online: true
      commands:
        - "eco give {player} 50000"
        - "msg {player} &a¡Recibiste tu Saco de 50,000 Dragmas!"
    dragmas-cofre:
      require-online: true
      commands:
        - "eco give {player} 250000"
        - "msg {player} &a¡Recibiste tu Cofre de 250,000 Dragmas!"
    dragmas-anfora:
      require-online: true
      commands:
        - "eco give {player} 1000000"
        - "msg {player} &a¡Recibiste tu Ánfora de 1,000,000 Dragmas!"

# ╔══════════════════════════════════════════════╗
# ║   Spawn natural de jefes míticos (Odysseia)  ║
# ╚══════════════════════════════════════════════╝
# Invoca jefes aleatorios cerca de jugadores cada cierto tiempo.
# NO genera estructuras: solo aparece la entidad en la superficie.
# ─────────────────────────────────────────────
boss-balance:
  # Escala común para todos los jefes, incluidos ataques especiales y proyectiles.
  health-multiplier: 2.25
  damage-multiplier: 2.10
  movement-speed-multiplier: 1.60
  knockback-resistance: 0.95
  follow-range: 72.0
  # 40 ticks = 2 segundos. Las skills internas mantienen sus propios cooldowns.
  skill-interval-ticks: 40
  announcement-radius: 64.0
  dialogue-radius: 48.0
  # Escudo cinematográfico breve al cruzar cada fase; bloquea golpes durante el telegraph.
  phase-shield-ticks: 32
  phase-rupture:
    # Descarga local al cambiar de fase. No modifica bloques ni carga chunks.
    radius: 8.0
    damage: 6.0
  combat-director:
    # Ataques comunes inspirados en encuentros por fases, limitados a una tarea pendiente por jefe.
    enabled: true
    target-range: 44.0
    cooldown-seconds: 9
    telegraph-ticks: 24
  mobility:
    # Teletransporte táctico: sólo flanquea jugadores lejanos y nunca carga chunks.
    enabled: true
    target-range: 56.0
    minimum-distance: 12.0
    flank-distance: 4.0
    cooldown-seconds: 7
  rebirth:
    # Renacen una vez al recibir daño letal. Prometeo conserva además su fénix propio.
    bosses: [thor, ares, hades, zeus, odin, kratos, heimdall, hidra, cerbero, tifon]
    health-percent: 0.55
    invulnerability-seconds: 5
  # Defensa adaptativa contra armas SF/Tinker y encantamientos de endgame.
  # Reduce ráfagas; no borra, modifica ni bloquea ítems de jugadores.
  adaptive-counters:
    enabled: true
    burst-window-seconds: 4
    counter-cooldown-seconds: 12
    normal:
      max-hit-health-fraction: 0.045
      max-burst-health-fraction: 0.20
    high-power:
      sharpness-threshold: 7
      max-hit-health-fraction: 0.025
      max-burst-health-fraction: 0.12

# ─────────────────────────────────────────────
# Arenas públicas de jefes (/bosswarp)
# Cada integrante de un grupo paga su entrada. Si el jefe no se puede crear,
# Odysseia reembolsa todos los cobros de esa sesión.
boss-arena:
  # Mundo fijo superplano. Si ya existe un mundo no plano con este nombre, no se borra en vivo.
  # Debe recrearse manualmente solo con el servidor detenido y sin jugadores dentro.
  world-border-size: 4096
  entry-fees:
    default: 500000
    zeus: 250000
    hades: 375000
    tifon: 1500000
    dragon: 2500000
    wither_storm: 5000000
    # Permiso opcional para pruebas administrativas sin retirar Dragmas.
    free-permission: "odysseia.bosswarp.free"
  targeted-challenges:
    players:
      # Pasiente. Se usa UUID para que un cambio de nick no reduzca el reto.
      # El divisor representa vida efectiva sin sobrepasar MAX_HEALTH: x1000000
      # significa que los golpes de jugadores bajan la vida del jefe un millón de veces menos.
      "7ddf2641-14fb-4c1f-8499-aa5ff6c6b295":
        name: "Pasiente"
        health-multiplier: 1000000.0

#  Purchase Engine: anuncios de compras confirmadas
# ─────────────────────────────────────────────
# Este endpoint es privado: el valor real vive solo en la configuración desplegada.
purchase-engine:
  announcements:
    enabled: true
    webhook-url: "REPLACE_ME_PURCHASE_WEBHOOK"
    chat-announcement: "&6&l⚡ &e¡Felicidades &b{player} &eha adquirido &a{product} &een la tienda! ¡Gracias por apoyar al servidor! &6&l⚡"
    discord-announcement: "🎉 **¡Felicidades {player} ha comprado {product} en el servidor! ¡Gracias por mantener el servidor vivo!** 🎉"
    global-sound:
      enabled: true
      sound: "UI_TOAST_CHALLENGE_COMPLETE"

  # Tebex solo entrega en su ciclo de sondeo: quien compra y entra recién pasado un ciclo espera
  # hasta el siguiente (a Rojo le tocaron 14 minutos el 2026-08-06). Al entrar alguien se le pide a
  # Tebex que revise ya. Varias entradas seguidas comparten una sola revisión.
  tebex-forcecheck:
    enabled: true
    # Margen tras la entrada, para que el jugador ya esté cargado si le toca un kit al inventario.
    delay-ticks: 60
    # Mínimo entre dos revisiones, para no golpear la API de Tebex. Mínimo aceptado: 30.
    cooldown-seconds: 90

#  Reinicio avisado (/restart30)
# ─────────────────────────────────────────────
# Pterodactyl no deja que el servidor se reinicie a sí mismo, así que Odysseia avisa, guarda y deja
# una petición en plugins/Odysseia/restart-request.json. Star la recoge cada 20s y llama al panel.
# La API key vive en Star a propósito: no debe estar en la caja donde corren 130 plugins.
reinicio:
  segundos-por-defecto: 30
  motivo-por-defecto: "mantenimiento"

#  Bóvedas: qué no puede entrar
# ─────────────────────────────────────────────
# Aplica a las dos bóvedas del servidor: PlayerVaultZ en el survival y las de modalidad en islas.
bovedas:
  # Una mochila de Slimefun no guarda sus ítems dentro del ítem: guarda un ID, y el contenido vive
  # en el almacén de Slimefun. Metida en una bóveda ocupa un slot y da acceso a todo lo que tiene.
  # 27 mochilas en una shulker, y la shulker en la bóveda, hacen que un slot valga cientos de stacks.
  bloquear-mochilas:
    enabled: true
    # También mira dentro de shulkers y bundles, que es como se intenta colar.
    revisar-contenedores: true
    # Niveles de anidamiento a revisar (shulker dentro de shulker dentro de...).
    profundidad-maxima: 3
    mensaje: "&6DrakesCraft &8· &7Las &emochilas de Slimefun&7 no entran en la bóveda: guardan un ID, no los ítems, y una sola valdría por cientos de slots. &7Usa la mochila directamente o un cofre."

natural-spawn:
  # Activar/desactivar el spawn natural automático
  enabled: false
  # Cada cuántos segundos se hace un "intento" de spawn (mínimo 60)
  interval-seconds: 1800
  # Probabilidad (0.0 - 1.0) de que el intento tenga éxito
  chance: 0.25
  # Máximo de jefes naturales vivos al mismo tiempo
  max-active: 2
  # Distancia (en bloques) a la que aparece respecto al jugador elegido
  min-distance: 40
  max-distance: 80
  # Mundos permitidos (vacío = todos los mundos)
  worlds: []
  # Jefes elegibles (vacío = todos). Ej: [thor, hidra, cerbero, tifon]
  bosses: []

# ─────────────────────────────────────────────
#  Luna de Sangre: hordas controladas de Odysseia
# ─────────────────────────────────────────────
# Los zombies de este evento sólo rompen los bloques listados y JAMÁS dentro de
# ProtectionStones. Si la API de protecciones falla, la rotura queda desactivada.
blood-moon:
  enabled: true
  chance: 0.18
  worlds: [world]
  waves: 3
  wave-interval-seconds: 45
  zombies-per-player: 5
  max-zombies-per-wave: 18
  final-boss:
    enabled: true
    id: dios_corrupto
  zombie-block-breaking:
    enabled: true
    # Sin cofres, máquinas, estaciones ni bloques de Slimefun: sólo terreno blando.
    allowed-materials:
      - DIRT
      - COARSE_DIRT
      - ROOTED_DIRT
      - GRASS_BLOCK
