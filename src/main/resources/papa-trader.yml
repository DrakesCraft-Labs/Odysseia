# ─────────────────────────────────────────────────────────────
#  Trueque de la Papa de mar
# ─────────────────────────────────────────────────────────────
#
# El NPC del spawn solo ejecuta /papatrueque; toda la lógica vive aquí, para poder comprobar que
# la papa es auténtica y registrar cada canje.
#
# Se recarga con /odysseia reload, sin reiniciar.
#
# SOLO cuentan las papas con marca interna. Las repartidas antes de que existiera la marca se
# convierten solas al abrir el menú, así que nadie pierde lo que tenía guardado.
#
# RITMO: el servidor reparte 1 papa cada 15 minutos a cada jugador conectado = 4 por hora.
#   1 stack   =  64 papas  =  16 horas de juego
#   1 inventario = 2304 papas = 576 horas
#   2 inventarios = 4608 papas = 1152 horas
# Como en un inventario no caben más de 2304, todo lo que pase de ahí se paga con la ALCANCÍA:
# se deposita con el botón del menú y se acumula sin techo.
#
# En "comandos", {jugador} se sustituye por el nombre. Se ejecutan como consola.

enabled: true
titulo-menu: "&6&l✦ Trueque de la Papa de mar ✦"

niveles:

  # ── Lo mínimo: algo por empezar a juntar ──────────────────
  cosmetico:
    nombre: "&aRastro del Dragon &7(7 dias)"
    coste: 8
    icono: "PRISMARINE_CRYSTALS"
    descripcion:
      - "&7El rastro que llevan los Hermes,"
      - "&7prestado durante una semana."
      - "&7Nada de poder: pura pinta."
    comandos:
      # Los dos nodos, no solo el del rastro: sin drakes.cosmetics.use el menu /cosmeticos rechaza
      # al jugador y el rastro tampoco se dibuja, asi que quien no fuera VIP pagaba 8 papas por
      # algo que no podia usar. Mismo fallo que tuvo la piedra de proteccion de la tienda.
      - "lp user {jugador} permission settemp drakes.cosmetics.use true 7d"
      - "lp user {jugador} permission settemp drakes.cosmetics.trail.dragon true 7d"
    unica: false

