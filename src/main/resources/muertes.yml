# ─────────────────────────────────────────────────────────────
#  Mensajes de muerte de DrakesCraft — Edición Multiverso, Cuántica & Comedia
# ─────────────────────────────────────────────────────────────
#
# MARCADORES:
#   {jugador}  quien murió
#   {asesino}  quien lo mató
#   {arma}     el arma usada
#   {mundo}    el mundo donde ocurrió
#   {y}        la altura Y

enabled: true

# Coletilla añadida automáticamente cuando alguien muere repetidamente
racha:
  minimo: 3
  ventana-minutos: 10
  coletillas:
    - "&8(van &c{veces}&8 en un rato, tómate un tecito y respira)"
    - "&8(&c{veces}&8 veces ya, esto dejó de ser mala suerte y es vocación)"
    - "&8(&c{veces}&8 seguidas — por favor alguien escóndale la armadura)"
    - "&8(&c{veces}&8 muertes, va camino al récord Guinness del servidor)"
    - "&8(&c{veces}&8 en diez minutos... impresionante consistencia en perder)"
    - "&8(&c{veces}&8 derrotas al hilo... ¿seguro que tienes el monitor encendido?)"
    - "&8(&c{veces}&8 caídas: los dioses en el Olimpo están llorando de la risa)"
    - "&8(&c{veces}&8 muertes: Hades ya te tiene preparado un departamento amoblado)"
    - "&8(&c{veces}&8 visitas al cementerio, el sepulturero te cobra tarifa plana)"
    - "&8(&c{veces}&8 f's en el chat, el botón de respawn pide clemencia)"
    - "&8(&c{veces}&8 descalabros cósmicos, la gravedad tiene algo personal contigo)"
    - "&8(&c{veces}&8 desintegraciones, tus átomos ya no saben cómo rearmarse)"

mensajes:

  # ══════════════════════════════════════════════════════════════
  # CAÍDAS & GRAVEDAD (FALL)
  # ══════════════════════════════════════════════════════════════
  fall:
    - "&e{jugador} &7probó que la gravedad en &f{mundo}&7 funciona al 100% de eficiencia."
    - "&e{jugador} &7cayó desde &f{y}&7 metros creyendo que era un pájaro. Spoiler: era una piedra."
    - "&e{jugador} &7intentó hacer MLG con un cubo de agua y puso el cubo... pero en su imaginación."
    - "&e{jugador} &7se cayó de tan alto que le dio tiempo de reflexionar sobre todas sus malas decisiones."
    - "&e{jugador} &7olvidó que no tenía el modo creativo activado antes de saltar al vacío."
    - "&e{jugador} &7aterrizó con la cara contra el suelo a velocidad terminal."
    - "&e{jugador} &7se tiró por el barranco buscando un atajo y encontró el lobby."
    - "&e{jugador} &7quiso imitar a Batman y terminó como tortilla en &f{mundo}&7."
    - "&e{jugador} &7hizo un clavado perfecto... lástima que no había piscina abajo."
    - "&e{jugador} &7tropezó con un píxel de aire y cayó desde la altura &f{y}&7."
    - "&e{jugador} &7confundió las leyes de Newton con una sugerencia opcional."
    - "&e{jugador} &7descubrió que el suelo es duro, implacable y no negocia."
    - "&e{jugador} &7quiso desafiar a Einstein y la aceleración gravitacional (9.8 m/s2) ganó."
    - "&e{jugador} &7dejó un cráter con su silueta grabado en el suelo."
    - "&e{jugador} &7pensó que un bloque de heno lo salvaría desde 200 bloques de altura."
    - "&e{jugador} &7cayó con estilo, elegancia y un impacto sísmico devastador."
    - "&e{jugador} &7quiso comprobar si había daño por caída. Ya lo confirmó."

  # ══════════════════════════════════════════════════════════════
  # AHOGAMIENTO (DROWNING)
  # ══════════════════════════════════════════════════════════════
  drowning:
    - "&e{jugador} &7olvidó que los humanos necesitan oxígeno para no apagarse."
    - "&e{jugador} &7quiso hablar con las sirenas en &f{mundo}&7 y se quedó a vivir con Bob Esponja."
    - "&e{jugador} &7bebió tanta agua que se convirtió en sopa marina humana."
    - "&e{jugador} &7pensó que aguantar la respiración 15 minutos era un logro desbloqueable."
    - "&e{jugador} &7intentó respirar bajo el agua usando pura fuerza de voluntad."
    - "&e{jugador} &7se quedó mirando un pez tropical hasta que se le desconectaron los pulmones."
    - "&e{jugador} &7quiso ser Aquaman pero sin superpoderes, sin tridente y sin oxígeno."
    - "&e{jugador} &7descubrió el fondo del océano... y no supo cómo volver a la superficie."
    - "&e{jugador} &7quedó atrapado bajo el hielo intentando picar con la mano vacía."
    - "&e{jugador} &7nadó con armadura de netherite completa creyendo que flotaría."

  # ══════════════════════════════════════════════════════════════
  # LAVA & FUEGO (LAVA & FIRE)
  # ══════════════════════════════════════════════════════════════
  lava:
    - "&e{jugador} &7se dio un baño termal en lava a 1.200 grados. Quedó bien crocante."
    - "&e{jugador} &7confundió la lava con salsa de tomate picante en &f{mundo}&7."
    - "&e{jugador} &7probó la temperatura de la lava con todo el cuerpo al mismo tiempo."
    - "&e{jugador} &7se convirtió en carbón vegetal de alta calidad para el asado del domingo."
    - "&e{jugador} &7buscaba diamantes en la capa -58 y encontró cremación instantánea gratuita."
    - "&e{jugador} &7hizo natación sincronizada en el lago de magma del Nether."
    - "&e{jugador} &7entró a la lava y sus herramientas se desintegraron en otra dimensión."
    - "&e{jugador} &7se derritió más rápido que mantequilla en una sartén al rojo vivo."
    - "&e{jugador} &7intentó enfriar la lava con su propio cuerpo."

  fire:
    - "&e{jugador} &7jugó con fuego y terminó como malvavisco tostado."
    - "&e{jugador} &7se convirtió en una antorcha humana que iluminó todo &f{mundo}&7."
    - "&e{jugador} &7olvidó la regla básica de 'detenerse, tirarse al suelo y rodar'."
    - "&e{jugador} &7ardió con la intensidad de una supernova en miniatura."
    - "&e{jugador} &7se prendió fuego y corrió en círculos gritando sin buscar agua."
    - "&e{jugador} &7se auto-cocinó a fuego lento hasta quedar a punto medio."

  # ══════════════════════════════════════════════════════════════
  # EXPLOSIONES (TNT, CAMAS, CRISTALES, CREEPERS)
  # ══════════════════════════════════════════════════════════════
  explosion:
    - "&e{jugador} &7intentó dormir en una cama en el Nether. La termodinámica explotó en su cara."
    - "&e{jugador} &7quiso jugar con TNT y ahora sus piezas están repartidas en 4 chunks distintos."
    - "&e{jugador} &7tocó un Cristal del End y aprendió química de impacto a la fuerza."
    - "&e{jugador} &7escuchó un 'tsss' a su espalda y conoció a su creador de inmediato."
    - "&c{asesino} &7le dio un abrazo explosivo a &e{jugador} &7sin pedir permiso."
    - "&e{jugador} &7se convirtió en confeti brillante gracias a la explosión de &c{asesino}&7."
    - "&e{jugador} &7se dio vuelta para ver quién venía y ¡BUM! Adiós inventario."
    - "&e{jugador} &7presionó la placa de presión de la pirámide del desierto creyendo que daba regalos."
    - "&e{jugador} &7fue eyectado a la estratosfera por una detonación milimétrica."
    - "&c{asesino} &7le enseñó a &e{jugador} &7por qué no se juega con pólvora en espacios cerrados."

  # ══════════════════════════════════════════════════════════════
  # EL VACÍO (VOID - ONEBLOCK & SKYBLOCK)
  # ══════════════════════════════════════════════════════════════
  void:
    - "&e{jugador} &7se resbaló en la isla de OneBlock y fue a saludar a los extraterrestres."
    - "&e{jugador} &7descubrió qué hay debajo de la capa -64 del SkyBlock: absolutamente nada."
    - "&e{jugador} &7se cayó de la isla mientras contestaba un WhatsApp en la vida real."
    - "&e{jugador} &7saltó al abismo del vacío creyendo firmemente que había un bloque invisible."
    - "&e{jugador} &7fue absorbido por la nada cósmica y se convirtió en polvo estelar."
    - "&e{jugador} &7tropezó en el borde de su parcela y se desvaneció en el espacio exterior."
    - "&e{jugador} &7tiró su inventario al vacío... y luego se tiró él mismo para acompañarlo."
    - "&e{jugador} &7olvidó agacharse (Shift) mientras construía el puente hacia el infinito."
    - "&e{jugador} &7se cayó de su propia isla por mirar las estrellas con la boca abierta."

  # ══════════════════════════════════════════════════════════════
  # COMBATE PVP
  # ══════════════════════════════════════════════════════════════
  pvp:
    - "&c{asesino} &7desinstaló a &e{jugador} &7del servidor usando &f{arma}&7."
    - "&e{jugador} &7fue educado en combate cuerpo a cuerpo por &c{asesino}&7 con &f{arma}&7."
    - "&c{asesino} &7le aplicó un combo de 25 hits a &e{jugador} &7y lo mandó al lobby sin escalas."
    - "&e{jugador} &7escribió '1v1 fácil' y &c{asesino} &7se lo tomó como algo estrictamente personal."
    - "&c{asesino} &7le dio una clase magistral de esgrima a &e{jugador} &7con &f{arma}&7."
    - "&e{jugador} &7culpó al lag con 12ms de ping, pero &c{asesino} &7simplemente le dio una paliza."
    - "&c{asesino} &7convirtió a &e{jugador} &7en una generosa donación de puntos de experiencia."
    - "&e{jugador} &7descubrió por las malas por qué &c{asesino} &7tiene mejor puntería con &f{arma}&7."
    - "&c{asesino} &7le reinició el sistema operativo a &e{jugador} &7con &f{arma}&7."

  # ══════════════════════════════════════════════════════════════
  # JEFES & MITOLOGÍA (BOSSES)
  # ══════════════════════════════════════════════════════════════
  jefe:
    - "&e{jugador} &7desafió a &c{asesino} &7y aprendió por qué los jefes se llaman jefes."
    - "&c{asesino} &7pisoteó a &e{jugador} &7como si fuera una hormiga en la arena del Olimpo."
    - "&e{jugador} &7entró a la arena de jefes con armadura de cuero y optimismo infundado."
    - "&c{asesino} &7le devolvió a &e{jugador} &7el boleto de entrada a golpes."
    - "&e{jugador} &7subestimó el poder divino de &c{asesino} &7y pagó con su alma."

  # ══════════════════════════════════════════════════════════════
  # AUTOGOL, SUICIDIO & TORPEZAS
  # ══════════════════════════════════════════════════════════════
  autogol:
    - "&e{jugador} &7se cansó de existir y aplicó auto-desconexión biológica voluntaria."
    - "&e{jugador} &7usó /kill porque caminar 50 bloques le daba demasiada flojera."
    - "&e{jugador} &7lanzó una perla de ender, rebotó en una pared y cayó directo a la lava."
    - "&e{jugador} &7se disparó a sí mismo con su propia flecha rebotada. Puntería inversa."
    - "&e{jugador} &7decidió que renacer salía más barato y rápido que cocinar comida."

  # ══════════════════════════════════════════════════════════════
  # HAMBRE (STARVATION)
  # ══════════════════════════════════════════════════════════════
  starvation:
    - "&e{jugador} &7se murió de hambre teniendo 5 cofres llenos de comida en su base."
    - "&e{jugador} &7olvidó que en este juego hay que masticar para que el corazón siga latiendo."
    - "&e{jugador} &7priorizó minar 14 horas seguidas antes que comerse una simple manzana."
    - "&e{jugador} &7intentó hacer fotosíntesis en la oscuridad y sus células no cooperaron."

  # ══════════════════════════════════════════════════════════════
  # VENENO & MAGIA
  # ══════════════════════════════════════════════════════════════
  poison:
    - "&e{jugador} &7se tomó un frasco verde misterioso que encontró tirado en una cueva."
    - "&e{jugador} &7comió ojos de araña fermentados creyendo que eran uvas gourmet."
    - "&e{jugador} &7perdió contra una toxina que olía a calcetín vencido hace 3 meses."
    - "&e{jugador} &7aprendió que no todas las botellas con líquido brillante son pociones de velocidad."

  magic:
    - "&e{jugador} &7recibió una poción arrojadiza de daño instantáneo II en plena frente."
    - "&c{asesino} &7hizo un truco de magia y &e{jugador} &7dejó de ocupar espacio en este plano."
    - "&e{jugador} &7tocó una runa mágica sin leer la letra chica del contrato arcano."
    - "&e{jugador} &7fue víctima de un hechizo tan potente que le descalibró el teclado."

  # ══════════════════════════════════════════════════════════════
  # WITHER & MARCHITAMIENTO
  # ══════════════════════════════════════════════════════════════
  wither:
    - "&e{jugador} &7se marchitó enterito y envejeció 80 años en 4 segundos."
    - "&e{jugador} &7se puso negro, se marchitó como flor en el desierto y se fue al lobby."
    - "&e{jugador} &7recibió un abrazo marchito del Wither y se descompuso celularmente."
    - "&e{jugador} &7se apagó lentamente con mucho dramatismo y cero dignidad."

  # ══════════════════════════════════════════════════════════════
  # RAYOS DE ZEUS (LIGHTNING)
  # ══════════════════════════════════════════════════════════════
  lightning:
    - "&e{jugador} &7fue seleccionado personalmente por Zeus para recibir 100.000 voltios de castigo."
    - "&e{jugador} &7hizo de pararrayos humano en medio de la tormenta en &f{mundo}&7."
    - "&7Zeus miró a &e{jugador} &7desde el Olimpo y dijo: 'a ese de ahí me lo cocinan bien tostado'."
    - "&e{jugador} &7recibió un rayo celestial con sabor a tostada con mantequilla quemada."

  # ══════════════════════════════════════════════════════════════
  # ÉLITRAS & ESTRELLADAS (FLY INTO WALL)
  # ══════════════════════════════════════════════════════════════
  fly_into_wall:
    - "&e{jugador} &7iba volando espectacular con élitras hasta que apareció una montaña salvaje."
    - "&e{jugador} &7confirmó a 150 km/h que las alas de Minecraft no vienen con frenos ABS."
    - "&e{jugador} &7se estampó contra un muro de ladrillos y quedó pegado como calcomanía."
    - "&e{jugador} &7quiso hacer una pirueta aérea acrobática y aterrizó con la nariz en la piedra."
    - "&e{jugador} &7confundió una pared sólida con el cielo abierto."

  # ══════════════════════════════════════════════════════════════
  # WARDEN & ATAQUE SÓNICO (SONIC BOOM)
  # ══════════════════════════════════════════════════════════════
  sonic_boom:
    - "&e{jugador} &7hizo ruido al lado de un Warden ciego y recibió un grito supersónico en el pecho."
    - "&e{jugador} &7aprendió por las malas por qué en las Ciudades Antiguas se camina agachado y en silencio."
    - "&c{asesino} &7le descalibró el esqueleto a &e{jugador} &7con un rayo sónico de 500 decibeles."
    - "&e{jugador} &7quiso cantar ópera en el Deep Dark y el Warden lo silenció para siempre."

  # ══════════════════════════════════════════════════════════════
  # NIEVE POLVO & CONGELAMIENTO (FREEZE)
  # ══════════════════════════════════════════════════════════════
  freeze:
    - "&e{jugador} &7pisó nieve polvo y se convirtió en una paleta helada sabor supervivencia."
    - "&e{jugador} &7se congeló entero a la altura &f{y}&7. Nadie le pasó una bufanda ni un café."
    - "&e{jugador} &7quedó tieso como estatua de hielo por no usar botas de cuero calentitas."
    - "&e{jugador} &7subestimó el frío polar y terminó listo para enfriar las bebidas del servidor."

  # ══════════════════════════════════════════════════════════════
  # CACTUS & PLANTAS (CONTACT)
  # ══════════════════════════════════════════════════════════════
  contact:
    - "&e{jugador} &7le dio un abrazo apasionado a un cactus en el desierto. El cactus ganó por goleada."
    - "&e{jugador} &7murió desangrado por tocar bayas dulces que pinchaban a simple vista."
    - "&e{jugador} &7tropezó con una planta espinosa y perdió toda su reputación de guerrero."

  # ══════════════════════════════════════════════════════════════
  # FLECHAS & PROYECTILES (PROJECTILE)
  # ══════════════════════════════════════════════════════════════
  projectile:
    - "&e{jugador} &7recibió un flechazo certero entre ceja y ceja desde el otro lado del mapa."
    - "&c{asesino} &7demostró puntería olímpica y clavó a &e{jugador} &7con un proyectil milimétrico."
    - "&e{jugador} &7intentó esquivar una flecha como en Matrix pero tropezó con sus propios pies."

  # ══════════════════════════════════════════════════════════════
  # CUÁNTICA, NETWORKS, SLIMEFUN, SINTÉRGICA & MULTIVERSO (GENÉRICO)
  # ══════════════════════════════════════════════════════════════
  generico:
    - "&e{jugador} &7estaba ordenando su red de Networks y un quark rebelde provocó una superposición cuántica donde murió y no murió a la vez."
    - "&e{jugador} &7colapsó su función de onda de Schrödinger: el observador abrió la caja y descubrió que estaba tieso."
    - "&e{jugador} &7tocó un cable de alta tensión de Slimefun sin guantes y fue teleportado al plano astral."
    - "&e{jugador} &7abrió un reactor nuclear de Slimefun para ver si el uranio ya estaba doradito para la cena."
    - "&e{jugador} &7distorsionó la Lattice de Jacobo Grinberg y su campo neuronal se quedó sin señal wifi."
    - "&e{jugador} &7sufrió una sobrecarga de 500.000 Joules mientras calibraba un condensador cuántico con un palo."
    - "&e{jugador} &7manipuló uranio enriquecido en calzoncillos sin ponerse el traje Hazmat reglamentario."
    - "&e{jugador} &7se metió dentro de un teletransportador de Networks sin configurar las coordenadas de destino."
    - "&e{jugador} &7intentó hacer inferencia cuántica y su existencia cayó en una indeterminación estadística permanente."
    - "&e{jugador} &7murió de una forma tan absurdamente cuántica que ni la física teórica supo explicarla."
    - "&e{jugador} &7se fue al lobby sin dar explicaciones, sin pagar sus deudas en /bank ni dejar herencia a sus amigos."
    - "&e{jugador} &7olvidó la regla número uno de DrakesCraft: respirar, no explotar y no morirse."
    - "&e{jugador} &7descalibró el generador de antimateria y fue borrado del registro dimensional."
    - "&e{jugador} &7dejó de existir en &f{mundo}&7 por motivos de fuerza mayor y falta de reflejos básicos."
    - "&e{jugador} &7colapsó su línea temporal en este cuadrante del multiverso de DrakesCraft."
